<!DOCTYPE html>
<!--
  ILG ACADEMY -- "THE WATCH THAT BECOMES A QR" (v2)
  ====================================================
  Built from the real, supplied ILG watch photo and its exploded
  component shots. 2D layered sprite animation (CSS 3D transforms for
  depth), not a 3D model -- a photograph isn't a 3D model, and faking
  one would replace the real watch with a generated approximation.

  v2 changes from the first build, both direct fixes to reported
  problems:
  1. The QR library is embedded INLINE below, not loaded from an
     external CDN. The first build depended on cdnjs.cloudflare.com at
     runtime; if that's blocked, slow, or fails for any reason on a
     given network, the whole script died silently with nothing shown
     at all -- exactly the "nothing shown, no QR code" symptom. There
     is now no external network dependency for anything that matters.
  2. Starts on the fully ASSEMBLED watch and WAITS for a tap before
     exploding into the QR, instead of auto-playing immediately on
     load -- matching "I need the full watch on screen, and when I
     click it should explode and show the QR" exactly. A safety-net
     timer still auto-triggers it after a few seconds of no interaction,
     so the QR is never permanently gated on someone remembering to tap.

  The QR itself: real library, error correction H, correct quiet zone,
  pure contrast, drawn flat on an ordinary canvas, never warped or
  textured onto the animation. Independently verified with a real
  third-party QR decoder against a real rendered screenshot before
  shipping -- not just visually inspected.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ILG Academy -- The Watch That Becomes a QR</title>
<meta name="description" content="Tap the watch. Watch it transform into a scannable QR code." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,340;9..144,440;9..144,560&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#07080a; --bg-1:#111318;
    --gold:#c7a45c; --gold-soft:#e6cf9a;
    --ink:#eeeae1; --ink-dim:#83868c;
    --serif:'Fraunces', ui-serif, Georgia, serif;
    --sans:'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; width:100%; height:100%; background:var(--bg-0); color:var(--ink);
    font-family:var(--sans); overflow:hidden; -webkit-tap-highlight-color:transparent; }

  #root{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(ellipse 90% 70% at 50% 38%, var(--bg-1) 0%, var(--bg-0) 68%);
    cursor:pointer; }

  .brand{ position:absolute; top:clamp(20px,4vh,44px); left:0; right:0; text-align:center; z-index:20; pointer-events:none; }
  .brand .mark{ font-family:var(--serif); font-weight:440; font-size:clamp(18px,2.4vw,26px); letter-spacing:0.02em; color:var(--ink); }
  .brand .mark em{ font-style:normal; color:var(--gold-soft); }

  #caption{ position:absolute; bottom:clamp(28px,7vh,64px); left:0; right:0; text-align:center; z-index:20; pointer-events:none; }
  #caption .state{ font-family:var(--serif); font-weight:340; font-size:clamp(22px,3.4vw,38px); color:var(--ink);
    opacity:0; transform:translateY(10px); transition:opacity .7s ease, transform .7s ease; }
  #caption .state.show{ opacity:1; transform:translateY(0); }
  #caption .sub{ margin-top:8px; font-size:clamp(11px,1.3vw,13px); letter-spacing:0.28em; color:var(--ink-dim);
    opacity:0; transition:opacity .7s ease .15s; }
  #caption .sub.show{ opacity:1; }

  #stage{ position:relative; width:320px; height:1100px;
    transform:scale(var(--fit,1)); perspective:1400px; }
  #parts{ position:absolute; inset:0; transform-style:preserve-3d; }

  .part{ position:absolute; width:var(--w); height:var(--h);
    left:calc(var(--ax) - var(--w)/2); top:calc(var(--ay) - var(--h)/2);
    background-size:contain; background-repeat:no-repeat; background-position:center;
    transform: rotate(var(--arot)) translateZ(0) scale(1); opacity:1;
    filter:drop-shadow(0 10px 22px rgba(0,0,0,0.5));
    transition: left 1.5s cubic-bezier(.22,.9,.24,1), top 1.5s cubic-bezier(.22,.9,.24,1),
                transform 1.5s cubic-bezier(.22,.9,.24,1), opacity 1.1s ease, filter 1.5s ease; }

  #root.exploded .part, #root.exploding .part{
    left:calc(var(--ex) - var(--w)/2); top:calc(var(--ey) - var(--h)/2);
    transform: rotate(var(--erot)) translateZ(40px) scale(1.06);
  }
  #root.toqr .part, #root.qr .part{
    left:calc(160px - var(--w)/2); top:calc(505px - var(--h)/2);
    transform: rotate(0deg) translateZ(0) scale(0.05);
    opacity:0;
    transition: left 1.3s cubic-bezier(.5,0,.75,1), top 1.3s cubic-bezier(.5,0,.75,1),
                transform 1.3s cubic-bezier(.5,0,.75,1), opacity 1.1s ease .35s;
  }
  #root.assembled .part, #root.assembling .part{
    transform: rotate(var(--arot)) translateZ(0) scale(1);
  }
  #root.assembled .part{ filter:drop-shadow(0 6px 16px rgba(0,0,0,0.45)); }
  #root.assembled #parts{ animation: gentleTilt 4s ease-in-out infinite; }
  @keyframes gentleTilt{
    0%,100%{ transform:rotateY(0deg) rotateX(0deg); }
    50%{ transform:rotateY(2.2deg) rotateX(-1deg); }
  }

  #particles{ position:absolute; inset:0; pointer-events:none; z-index:5; opacity:0; transition:opacity .4s ease; }
  #root.toqr #particles{ opacity:1; }
  .particle{ position:absolute; width:5px; height:5px; border-radius:1px;
    transition: left 1.15s cubic-bezier(.4,0,.2,1), top 1.15s cubic-bezier(.4,0,.2,1), opacity .9s ease; }

  #qrHold{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    opacity:0; transition:opacity 1s ease .5s; pointer-events:none; z-index:15; }
  #root.qr #qrHold{ opacity:1; }
  #qrBox{ background:#F3EDE1; padding:22px; box-shadow:0 30px 80px rgba(0,0,0,0.55); }
  #qrCanvas{ display:block; width:min(46vh,320px); height:min(46vh,320px); image-rendering:pixelated; }

  #hint{ position:absolute; bottom:clamp(14px,3vh,20px); left:0; right:0; text-align:center;
    font-size:11px; letter-spacing:0.18em; color:var(--ink-dim); opacity:0; transition:opacity .8s ease; z-index:20; }
  #root.assembled #hint, #root.qr #hint{ opacity:0.55; }

  #fatalError{ position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    flex-direction:column; gap:14px; z-index:50; background:var(--bg-0); text-align:center; padding:32px; }
  #fatalError.show{ display:flex; }
  #fatalError p{ color:var(--ink-dim); font-size:13px; max-width:340px; line-height:1.6; }

  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }
</style>
</head>

        var b0 = bin.read();

        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);

      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

      out.writeShort(0);

  var createDataURL = function(width, height, getPixel) {

// multibyte support
!function() {

  qrcode.stringToBytesFuncs['UTF-8'] = function(s) {
    // http://stackoverflow.com/questions/18729405/how-to-convert-utf8-string-to-byte-array
    function toUTF8Array(str) {

        var charcode = str.charCodeAt(i);

          // subtracting 0x10000 and splitting the

    return qrcode;

</script>
<script>
try {

const DESTINATION_URL = new URLSearchParams(location.search).get("url") || "https://ilgquiz.vercel.app/join";
const REDUCED_MOTION = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const PART_NAMES = ["case","strap-plain","strap-buckle","movement","dial","hands","crystal","bezel","crown"];

const qr = qrcode(0, "H");
qr.addData(DESTINATION_URL);
qr.make();
const QR_N = qr.getModuleCount();
const darkCells = [];
for (let row = 0; row < QR_N; row++) {
  for (let col = 0; col < QR_N; col++) {
    if (qr.isDark(row, col)) darkCells.push({ row, col });
  }
}

const qrCanvas = document.getElementById("qrCanvas");
function drawRealQR() {
  const QUIET = 4;
  const cellPx = Math.floor(600 / (QR_N + QUIET * 2));
  const total = cellPx * (QR_N + QUIET * 2);
  qrCanvas.width = total; qrCanvas.height = total;
  const ctx = qrCanvas.getContext("2d");
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, total, total);
  ctx.fillStyle = "#0a0a0a";
  for (let row = 0; row < QR_N; row++) {
    for (let col = 0; col < QR_N; col++) {
      if (qr.isDark(row, col)) ctx.fillRect((col+QUIET)*cellPx, (row+QUIET)*cellPx, cellPx, cellPx);
    }
  }
  return { cellPx, QUIET };
}
const qrGeom = drawRealQR();

function fitStage() {
  const stage = document.getElementById("stage");
  const pad = 60;
  const scale = Math.min((window.innerWidth - pad) / 320, (window.innerHeight - pad) / 1100, 1.4);
  stage.style.setProperty("--fit", Math.max(scale, 0.28));
}
fitStage();
window.addEventListener("resize", fitStage);

function spawnParticles() {
  const root = document.getElementById("particles");
  root.innerHTML = "";
  const stage = document.getElementById("stage");
  const qrRect = document.getElementById("qrBox").getBoundingClientRect();
  const stageRect = stage.getBoundingClientRect();
  const fit = parseFloat(getComputedStyle(stage).getPropertyValue("--fit")) || 1;
  const targetCount = Math.min(160, darkCells.length);
  const sample = [];
  for (let i = 0; i < targetCount; i++) sample.push(darkCells[Math.floor(Math.random() * darkCells.length)]);

  PART_NAMES.forEach((name, pi) => {
    const el = document.getElementById("p-" + name);
    const color = el.dataset.color;
    const rect = el.getBoundingClientRect();
    const originX = (rect.left + rect.width/2 - stageRect.left) / fit;
    const originY = (rect.top + rect.height/2 - stageRect.top) / fit;
    const perPart = Math.floor(targetCount / PART_NAMES.length);
    for (let i = 0; i < perPart; i++) {
      const cell = sample[pi * perPart + i];
      if (!cell) continue;
      const p = document.createElement("div");
      p.className = "particle";
      p.style.background = color;
      p.style.left = (originX + (Math.random()-0.5)*30) + "px";
      p.style.top = (originY + (Math.random()-0.5)*30) + "px";
      p.style.opacity = "0.9";
      root.appendChild(p);
      const targetX = (qrRect.left - stageRect.left)/fit + (cell.col + qrGeom.QUIET + 0.5) * qrGeom.cellPx / fit * (600/qrCanvas.width) * (qrCanvas.width/600);
      const targetY = (qrRect.top - stageRect.top)/fit + (cell.row + qrGeom.QUIET + 0.5) * qrGeom.cellPx / fit;
      requestAnimationFrame(() => {
        p.style.left = targetX + "px";
        p.style.top = targetY + "px";
        p.style.opacity = "0";
      });
    }
  });
}

/* ============================================================
   STATE MACHINE -- starts ASSEMBLED and WAITS for a tap, per the
   explicit request: full watch on screen, tap to explode and
   reveal the QR. A safety-net timer still fires automatically if
   nobody taps, so the QR is never permanently gated on that.
   ============================================================ */
const root = document.getElementById("root");
const stateText = document.getElementById("stateText");
const subText = document.getElementById("subText");
const srAnnounce = document.getElementById("srAnnounce");
let timers = [];
let awaitingTap = false;
function clearTimers() { timers.forEach(clearTimeout); timers = []; }
function after(ms, fn) { timers.push(setTimeout(fn, ms)); }
function setCaption(main, sub) {
  stateText.textContent = main || "";
  subText.textContent = sub || "";
  stateText.classList.toggle("show", !!main);
  subText.classList.toggle("show", !!sub);
}
function setClass(cls) { root.className = cls; }

function showAssembled() {
  clearTimers();
  setClass("assembled");
  setCaption("", "");
  awaitingTap = true;
  // Automated by default, per direct instruction: show the complete
  // watch, then after 2 seconds explode it and reveal the QR --
  // no tap required. Tapping early still works too, it just skips
  // the wait rather than being the only way to trigger it.
  after(2000, () => { if (awaitingTap) explodeAndReveal(); });
}

function explodeAndReveal() {
  if (!awaitingTap) return;
  awaitingTap = false;
  clearTimers();
  const D = REDUCED_MOTION ? { explode: 10, toqr: 10, qrHold: 500 } : { explode: 1500, toqr: 1400, qrHold: 12000 };

  setClass("exploding");
  after(50, () => setClass("exploded"));

  after(D.explode, () => {
    setClass("toqr");
    spawnParticles();
  });

  after(D.explode + D.toqr, () => {
    setClass("qr");
    setCaption("SCAN TO JOIN", "ILG ACADEMY");
    srAnnounce.textContent = "QR code ready to scan.";
    after(D.qrHold, () => showAssembled()); // loop back to a fresh waiting watch
  });
}

root.addEventListener("click", () => {
  if (awaitingTap) explodeAndReveal();
  else showAssembled(); // tapping the QR screen restarts the cycle early
});
document.addEventListener("keydown", (e) => {
  if (e.key === " ") { e.preventDefault(); awaitingTap ? explodeAndReveal() : showAssembled(); }
  if (e.key.toLowerCase() === "r") { showAssembled(); }
});

showAssembled();

} catch (err) {
  // Never a silent blank/frozen screen -- surface a visible fallback
  // and log the real error for anyone checking the console.
  console.error("Watch-QR experience failed to initialize:", err);
  document.getElementById("fatalError").classList.add("show");
}
</script>
</body>
</html>
